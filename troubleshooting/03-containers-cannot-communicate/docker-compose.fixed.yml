# Fixed: the api joins BOTH networks.
#   frontend: web <-> api   (so nginx can find "api")
#   backend:  api <-> db    (so the api can find "db")
# The database stays on backend only: web still cannot reach it.
name: ts03

services:
  web:
    build: ../../examples/multi-container-app/web
    ports:
      - "8080:80"
    networks: [frontend]
    depends_on: [api]

  api:
    build: ../../examples/multi-container-app/api
    environment:
      DB_HOST: db
      DB_PASSWORD: board-lab-password
    networks: [frontend, backend]
    depends_on: [db]

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: board
      POSTGRES_USER: board
      POSTGRES_PASSWORD: board-lab-password
    volumes:
      - ../../examples/multi-container-app/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [backend]

networks:
  frontend:
  backend:
