name: ts06

services:
  web:
    build: ../../examples/multi-container-app/web
    ports:
      - "8080:80"
    depends_on: [api]

  api:
    build: ../../examples/multi-container-app/api
    environment:
      DB_HOST: db
      DB_NAME: board
      DB_USER: board
    depends_on: [db]

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: board
      POSTGRES_USER: board
      POSTGRES_PASSWORD: board-lab-password
    volumes:
      - ../../examples/multi-container-app/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
